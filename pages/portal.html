<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal — Mokio</title>
  <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="../index.html" class="logo">
        <img src="../images/logo.svg" alt="Mokio" class="logo-img">
        <span class="logo-text">Mokio</span>
      </a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../index.html#features">Features</a>
        <a href="../index.html#waitlist">Waitlist</a>
      </nav>
      <div class="nav-right">
        <button type="button" class="account-btn" id="accountBtn">
          <span class="account-btn-icon">M</span>
          <span id="accountBtnText">Sign In</span>
        </button>
        <button class="mobile-menu-btn" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <a href="portal.html" class="dev-tab" id="staffNavLink">Portal</a>
      </div>
    </div>
  </header>

  <section id="staff" class="staff">
    <div class="container">
      <div class="section-header">
        <h2>Staff portal</h2>
        <p id="staffWelcome">Sign in to open the pages for your role.</p>
      </div>

      <div class="staff-grid">
        <a class="staff-card" href="owner.html" data-roles="owner" hidden>
          <div class="role-badge owner">Owner</div>
          <h3>Owner area</h3>
          <p>Owner tools and pages</p>
        </a>

        <a class="staff-card" href="mod.html" data-roles="owner,mod" hidden>
          <div class="role-badge mod">Mod</div>
          <h3>Mod area</h3>
          <p>Moderator tools and pages.</p>
        </a>

        <a class="staff-card" href="https://dev.mokio.online/" data-roles="owner,tester" hidden>
          <div class="role-badge tester">Tester</div>
          <h3>Tester area</h3>
          <p>Tester tools and pages.</p>
        </a>
      </div>
    </div>
  </section>

    <div data-component="auth-modal"></div>

  <div data-component="footer"></div>

  <script>
    window.MOKIO_REQUIRED_ROLES = ['owner', 'mod', 'tester'];
  </script>
  <script src="../script/components.js"></script>
  <script src="../script/script.js"></script>
</body>
</html>
