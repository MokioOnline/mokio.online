<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mokio Release Pages</title>
  <link rel="icon" href="../../images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="../../index.html" class="logo">
        <img src="../../images/logo.svg" alt="Mokio" class="logo-img">
        <span class="logo-text">Mokio</span>
      </a>
      <nav class="nav-links">
        <a href="../../index.html#features">Features</a>
        <a href="https://app.mokio.online">Apps</a>
        <a href="../../index.html#vision">Vision</a>
        <a href="../../index.html#waitlist" class="btn btn-small">Join Waitlist</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 120px 24px 80px; max-width: 720px;">
    <h1 style="font-family: var(--font-display); font-size: 32px; margin-bottom: 12px;">Release pages</h1>
    <p style="color: var(--text-muted); margin-bottom: 28px;">
      This folder is ready for future release pages. Add a new HTML file here for each release when you’re ready to publish it.
    </p>
    <ul style="display: grid; gap: 12px; padding: 0; list-style: none;">
      <li style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; color: var(--text-muted);">
        Example: <code style="color: var(--text);">releases/pages/wave-1.0.html</code>
      </li>
      <li style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; color: var(--text-muted);">
        Example: <code style="color: var(--text);">releases/pages/arc-beta.html</code>
      </li>
    </ul>
    <p style="margin-top: 28px;">
      <a href="https://app.mokio.online" class="btn btn-primary">Open Apps</a>
      <a href="../../index.html" class="btn btn-secondary" style="margin-left: 8px;">Back home</a>
    </p>
  </main>
</body>
</html>
